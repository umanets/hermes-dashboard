[project]
name = "hermes-music-tools"
version = "0.1.0"
description = "Apple Music + TIDAL integration for the Hermes Agent, exposed as an MCP (FastMCP) tool server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ihor Umanets" }]

dependencies = [
    "mcp>=1.26.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "cryptography>=42.0",
]

[project.scripts]
hermes-music-server = "server:main"
music-tools = "music_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["music_service"]
only-include = ["music_service", "server.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
