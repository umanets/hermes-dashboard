[project]
name = "hermes-vector-memory"
version = "0.1.0"
description = "Persistent semantic memory for Hermes — Chroma store, capture hook, recall MCP."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26.0",
    "chromadb>=0.5.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vector_memory"]
only-include = ["vector_memory", "server.py", "capture_store.py", "summarize_job.py"]
